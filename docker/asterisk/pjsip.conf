; Asterisk 20 PJSIP Trunk & WebRTC Configuration (/etc/asterisk/pjsip.conf)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.pem
priv_key_file=/etc/asterisk/keys/asterisk.key

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

[telnyx_us_west_auth]
type=auth
auth_type=userpass
username=vx_trunk_sf01
password=CHANGE_ME_IN_VAULT

[telnyx_us_west_aor]
type=aor
contact=sip:sip.telnyx.com:5060
qualify_frequency=30

[telnyx_us_west_reg]
type=registration
transport=transport-udp
outbound_auth=telnyx_us_west_auth
server_uri=sip:sip.telnyx.com:5060
client_uri=sip:vx_trunk_sf01@sip.telnyx.com:5060
retry_interval=60

[telnyx_us_west]
type=endpoint
transport=transport-udp
context=from-sip-trunk
disallow=all
allow=ulaw,alaw,opus
outbound_auth=telnyx_us_west_auth
aors=telnyx_us_west_aor
direct_media=no
dtmf_mode=rfc4733

[webrtc_op_101]
type=endpoint
transport=transport-wss
context=voxpulse-outbound
disallow=all
allow=opus,ulaw
webrtc=yes
dtls_auto_generate_cert=yes
