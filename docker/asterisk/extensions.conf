; Asterisk Dialplan (/etc/asterisk/extensions.conf)
[general]
static=yes
writeprotect=no

[from-sip-trunk]
exten => _X.,1,NoOp(Inbound SIP Call from ${CALLERID(num)} to ${EXTEN})
 same => n,Ringing()
 same => n,Stasis(voxpulse-voice-engine,inbound,${CALLERID(num)},${EXTEN})
 same => n,Hangup()

[voxpulse-outbound]
exten => _+1NXXNXXXXXX,1,NoOp(Outbound Consent-Verified Call to ${EXTEN})
 same => n,Set(CALLERID(all)=${VOXPULSE_CID})
 same => n,Stasis(voxpulse-voice-engine,outbound,${EXTEN},${VOXPULSE_RECORDING_ID})
 same => n,Hangup()
